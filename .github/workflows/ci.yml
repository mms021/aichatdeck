name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aichatdeck
          POSTGRES_PASSWORD: aichatdeck
          POSTGRES_DB: aichatdeck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aichatdeck"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://aichatdeck:aichatdeck@localhost:5432/aichatdeck?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: generated code is up to date
        run: buf generate && git diff --exit-code internal/gen

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke.sh
      - name: metrics exported
        run: docker compose exec -T prometheus wget -qO- http://server:47090/metrics | grep -q 'aichatdeck_task_events_total{event="submitted"} 1'
      - name: events reach the Kafka consumer
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T prometheus wget -qO- http://analytics:47093/metrics \
              | grep -q 'aichatdeck_analytics_events_total{type="task.verified"} 1' && exit 0
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs
