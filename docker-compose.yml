# Full local stack: `docker compose up -d --build`, then http://localhost:47080.
# Host ports sit in the 47xxx block to avoid clashing with local services;
# override with PG_PORT, REDIS_PORT, SERVER_PORT, PROMETHEUS_PORT, GRAFANA_PORT, KAFKA_PORT.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aichatdeck
      POSTGRES_PASSWORD: aichatdeck
      POSTGRES_DB: aichatdeck
    ports: ["127.0.0.1:${PG_PORT:-47432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aichatdeck"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-47379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:47092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-47092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["127.0.0.1:${KAFKA_PORT:-47092}:47092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      retries: 30

  server:
    build: .
    environment:
      DATABASE_URL: postgres://aichatdeck:aichatdeck@postgres:5432/aichatdeck?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:${SERVER_PORT:-47080}:47080"
      - "127.0.0.1:${GRPC_PORT:-47051}:47051"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics:
    build:
      context: .
      args: { CMD: analytics }
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-47091}:9090"]
    depends_on: [server]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aichatdeck.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-47300}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
